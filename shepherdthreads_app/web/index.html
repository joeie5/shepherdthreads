<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Shepherds Thread &mdash; Christian clothing, heavyweight essentials made slowly and worn with conviction.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Shepherds Thread">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Opens the connection to Supabase (DNS + TLS handshake) and the
       CanvasKit CDN while the browser is still downloading/parsing this
       page, instead of waiting until Dart code issues the first request
       after the engine boots — shaves real time off the splash screen. -->
  <link rel="preconnect" href="https://skbebcjztkxmywznpwsx.supabase.co" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <title>Shepherds Thread</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Shown until Flutter's first frame paints. main.dart awaits both
       Supabase.initialize() and the initial product/collection fetch
       before runApp(), so without this the page is blank white for a
       few seconds on a cold load. */
    #splash {
      position: fixed;
      inset: 0;
      background: #0A0A0A;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    #splash span {
      font-family: Georgia, 'Times New Roman', serif;
      color: #F7F5F0;
      font-size: 20px;
      letter-spacing: 0.08em;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div id="splash"><span>Shepherds Thread</span></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });
  </script>
  <script>
    // Flutter's own service-worker caching (flutter_service_worker.js) is
    // deprecated and has been observed here to leave a stale worker
    // intercepting requests after a deploy — flutter_bootstrap.js then
    // hangs forever as "pending" under that worker, and the app never gets
    // past the splash screen. We don't register a new service worker (see
    // --pwa-strategy=none in the build), so any worker found here is a
    // leftover from an older deploy; unregister it and reload once so the
    // page is served directly over the network instead.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      if (sessionStorage.getItem('sw-cleanup-done')) return;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (regs.length === 0) return;
        sessionStorage.setItem('sw-cleanup-done', '1');
        Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
          window.location.reload();
        });
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
